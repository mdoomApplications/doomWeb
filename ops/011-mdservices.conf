# MDServices: TLS terminates on the existing nginx reverse proxy.
# The HTTPS origin uses the same internal certificate as the other virtual hosts.
<VirtualHost *:80>
    ServerName www.mdoom.net
    ServerAlias mdoom.net
    DocumentRoot /var/www/html/mdservices
    Include /etc/apache2/sites-available/mdservices-common.inc
</VirtualHost>
<VirtualHost *:443>
    ServerName www.mdoom.net
    ServerAlias mdoom.net
    DocumentRoot /var/www/html/mdservices
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/webview.crt
    SSLCertificateKeyFile /etc/apache2/ssl/webview.key
    Include /etc/apache2/sites-available/mdservices-common.inc
</VirtualHost>
